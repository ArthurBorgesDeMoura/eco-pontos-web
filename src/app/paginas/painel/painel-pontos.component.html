<p class="so-leitor-de-tela" role="status">{{ anuncio }}</p>
<p class="so-leitor-de-tela" role="alert">{{ alerta }}</p>

<p *ngIf="carregando" class="painel__carregando">{{ mensagem.carregando }}</p>

<div *ngIf="!carregando && erro" class="painel__estado painel__estado--erro">
  <p class="painel__estado-mensagem">{{ erro }}</p>
  <button
    eco-botao
    type="button"
    tipo="secundario"
    [attr.aria-disabled]="tentando ? 'true' : null"
    (click)="tentarDeNovo()"
  >
    Tentar de novo
  </button>
</div>

<div *ngIf="!carregando && !erro && itens.length === 0" class="painel__estado">
  <p class="painel__estado-mensagem" tabindex="-1">{{ mensagem.vazio }}</p>
</div>

<ng-container *ngIf="!carregando && !erro && itens.length > 0">
  <eco-tabela
    class="painel__tabela"
    legenda="Pontos publicados"
    [itens]="itens"
    [total]="total"
    [itensSaindo]="saindo"
    [carregando]="maisIndisponivel"
    [rastrearPor]="porId"
    (mostrarMais)="mostrarMais()"
  >
    <ng-template ecoColuna="Ponto" let-ponto>
      <eco-celula-ponto [nome]="ponto.nome" [bairro]="bairro(ponto)" [endereco]="ponto.endereco"></eco-celula-ponto>
    </ng-template>
    <ng-template ecoColuna="Materiais" largura="larga" let-ponto>{{ materiais(ponto) }}</ng-template>
    <ng-template ecoColuna="Ações" largura="acoes" let-ponto>
      <ng-container *ngTemplateOutlet="acoes; context: { $implicit: ponto, tamanho: 'p', tipo: 'texto' }"></ng-container>
    </ng-template>
  </eco-tabela>

  <div class="painel__compacto">
    <ul class="painel__cartoes" aria-label="Pontos publicados">
      <li
        *ngFor="let ponto of itens; trackBy: porId"
        class="painel__cartao"
        [class.painel__cartao--saindo]="saindo.includes(ponto)"
      >
        <div class="painel__cartao-dados">
          <span class="painel__nome">{{ ponto.nome }}</span>
          <span class="painel__local">{{ local(ponto) }}</span>
          <span class="painel__materiais">{{ materiais(ponto) }}</span>
        </div>
        <div class="painel__cartao-acoes">
          <ng-container *ngTemplateOutlet="acoes; context: { $implicit: ponto, tamanho: 'g', tipo: 'secundario' }"></ng-container>
        </div>
      </li>
    </ul>
    <div class="painel__rodape">
      <p class="painel__resumo" tabindex="-1">{{ resumo }}</p>
      <button
        *ngIf="haMais"
        eco-botao
        type="button"
        tipo="secundario"
        tamanho="g"
        [attr.aria-disabled]="maisIndisponivel ? 'true' : null"
        (click)="mostrarMais()"
      >
        Mostrar mais
      </button>
    </div>
  </div>

  <p *ngIf="erroDoMais" class="painel__erro-do-mais">{{ erroDoMais }}</p>
</ng-container>

<ng-template #acoes let-ponto let-tamanho="tamanho" let-tipo="tipo">
  <a
    eco-botao
    [tipo]="tipo"
    [tamanho]="tamanho"
    [routerLink]="rotaDaEdicao(ponto.idPonto)"
    [attr.data-ponto]="ponto.idPonto"
    data-acao="editar"
    (click)="lembrar(ponto)"
  >
    Editar<span class="so-leitor-de-tela"> {{ ponto.nome }}</span>
  </a>
  <button
    eco-botao
    type="button"
    [tipo]="tipo"
    [tamanho]="tamanho"
    [attr.data-ponto]="ponto.idPonto"
    data-acao="excluir"
    [attr.aria-disabled]="excluindo.has(ponto.idPonto) ? 'true' : null"
    (click)="excluir(ponto)"
  >
    Excluir<span class="so-leitor-de-tela"> {{ ponto.nome }}</span>
  </button>
</ng-template>
